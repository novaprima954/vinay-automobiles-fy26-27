<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="robots" content="noindex, nofollow">
  <title>Operator - DMS, Insurance & RTO</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #f4f5f9; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .op-container { max-width: 1500px; margin: 0 auto; padding: 0 14px 40px; }

    .op-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px 20px;
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; margin: 0 -14px 16px;
    }
    .op-header h1 { margin: 0; font-size: 19px; flex: 1; }
    .op-header .who { font-size: 13px; opacity: 0.9; }
    .btn-back { background: rgba(255,255,255,0.2); border: none; color: white; font-size: 18px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

    .card { background: white; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .dash-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .dash-head h2 { margin: 0; font-size: 18px; color: #333; }
    .dash-filters { display: flex; gap: 8px; }
    .dash-filters select, .search-row input, .bulk-bar select, .bulk-bar input[type="date"], .modal-body input[type="date"] {
      padding: 8px 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; background: white;
    }
    .dash-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .dash-card { border-radius: 10px; padding: 18px 12px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: transform .15s, box-shadow .15s; user-select: none; }
    .dash-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
    .dash-card.active { border-color: #333; transform: translateY(-3px); }
    .dash-count { font-size: 34px; font-weight: 800; line-height: 1; }
    .dash-label { font-size: 13px; font-weight: 700; margin-top: 6px; }
    .dash-sub { font-size: 11px; margin-top: 3px; opacity: 0.8; }
    .c-all { background: #ede7f6; color: #4527a0; } .c-dms { background: #e3f2fd; color: #1565c0; }
    .c-ins { background: #fff8e1; color: #e65100; } .c-rto { background: #fce4ec; color: #b71c1c; } .c-done { background: #e8f5e9; color: #2e7d32; }

    .search-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .search-row input { flex: 1; min-width: 220px; }
    .btn { padding: 9px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    .btn-secondary { background: #eef0fb; color: #4a4f9a; }
    .btn-danger { background: #fdecea; color: #b71c1c; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .filter-label { font-size: 13px; color: #666; margin: 4px 0 10px; font-weight: 600; }
    .bulk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 12px; background: #f0f4ff; border: 1px solid #c7d2fe; border-radius: 10px; font-size: 14px; }
    .bulk-bar .count { font-weight: 800; color: #3730a3; min-width: 90px; }
    .bulk-bar label.opt { display: flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; }
    .bulk-bar .hint { margin-left: auto; color: #777; font-size: 12px; }

    .table-wrap { overflow-x: auto; }
    table.op-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1050px; }
    .op-table th { background: #f0f2ff; color: #444; text-align: left; padding: 9px 10px; white-space: nowrap; }
    .op-table td { padding: 9px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
    .op-table tr.done-row { background: #f6fbf6; }
    .stage { font-size: 12px; line-height: 1.35; }
    .stage.pend { color: #b26a00; font-weight: 700; }
    .stage.ok { color: #2e7d32; }
    .stage .who-name { color: #666; }
    input.row-cb, #selectAll { width: 17px; height: 17px; cursor: pointer; }
    .empty { text-align: center; color: #999; padding: 40px 10px; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 14px; }
    .modal.show { display: flex; }
    .modal-content { background: white; border-radius: 12px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #eee; }
    .modal-head h3 { margin: 0; font-size: 17px; }
    .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #666; }
    .modal-body { padding: 16px 18px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid #eee; }
    .stage-opt { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 14px; font-weight: 600; }
    .stage-opt small { font-weight: 400; color: #777; }
    .toast { position: fixed; top: 16px; right: 16px; background: #333; color: white; padding: 10px 16px; border-radius: 8px; z-index: 200; display: none; max-width: 360px; font-size: 14px; }
    .toast.ok { background: #2e7d32; } .toast.err { background: #c62828; } .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="op-container">
    <div class="op-header">
      <button class="btn-back" onclick="window.location.href='home.html'">←</button>
      <h1>🚗 Operator — DMS, Insurance &amp; RTO</h1>
      <span class="who" id="currentUser"></span>
    </div>

    <!-- Dashboard -->
    <div class="card">
      <div class="dash-head">
        <h2>📊 Dashboard <span style="font-size:12px;font-weight:500;color:#888;">· by invoice date (HSRP sheet)</span></h2>
        <div class="dash-filters">
          <select id="dashMonth" onchange="loadMonth()"></select>
          <select id="dashYear" onchange="loadMonth()"></select>
        </div>
      </div>
      <div class="dash-cards" id="dashCards"><div class="empty" style="grid-column:1/-1;">Loading…</div></div>
    </div>

    <!-- Search + list -->
    <div class="card">
      <div class="search-row">
        <input type="text" id="searchBox" placeholder="Search invoice no, customer, mobile, chassis or ref customer (all months)…">
        <button class="btn btn-primary" onclick="runSearch()">🔍 Search</button>
        <button class="btn btn-secondary" onclick="clearSearch()">✕ Clear</button>
      </div>
      <div class="filter-label" id="filterLabel"></div>

      <div class="bulk-bar" id="bulkBar">
        <span class="count" id="bulkCount">0 selected</span>
        <label class="opt"><input type="checkbox" id="bulkDms" onchange="onBulkStageChange()"> DMS</label>
        <label class="opt"><input type="checkbox" id="bulkIns" onchange="onBulkStageChange()"> Insurance</label>
        <label class="opt"><input type="checkbox" id="bulkVah" onchange="onBulkStageChange()"> RTO</label>
        <span id="bulkDateWrap" style="display:none;">Date <input type="date" id="bulkDate"></span>
        <button class="btn btn-primary" id="bulkApplyBtn" onclick="applyBulk()">Apply to selected</button>
        <button class="btn btn-secondary" onclick="clearSelection()">Clear</button>
        <span class="hint">Max 20 at a time · done by <strong id="opName"></strong></span>
      </div>

      <div class="table-wrap">
        <table class="op-table">
          <thead><tr>
            <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" title="Select (max 20)"></th>
            <th>Invoice</th><th>Date</th><th>Customer</th><th>Mobile</th><th>Model</th><th>Chassis No</th><th>Ref Customer</th>
            <th>DMS</th><th>Insurance</th><th>RTO</th><th></th>
          </tr></thead>
          <tbody id="opBody"><tr><td colspan="12" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Single update -->
  <div class="modal" id="updateModal">
    <div class="modal-content">
      <div class="modal-head"><h3 id="updTitle">Update</h3><button class="modal-close" onclick="closeModals()">×</button></div>
      <div class="modal-body">
        <div id="updInfo" style="font-size:13px;color:#555;margin-bottom:8px;"></div>
        <label class="stage-opt"><input type="checkbox" id="updDms"> DMS <small id="updDmsNote"></small></label>
        <label class="stage-opt"><input type="checkbox" id="updIns"> Insurance <small id="updInsNote"></small></label>
        <label class="stage-opt"><input type="checkbox" id="updVah"> RTO <small id="updVahNote"></small></label>
        <div id="updDateWrap" style="margin-top:8px;">Date <input type="date" id="updDate"></div>
        <div style="font-size:12px;color:#777;margin-top:10px;">Saved under your name. Once Insurance or RTO is saved it is locked.</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
        <button class="btn btn-primary" id="updSaveBtn" onclick="saveSingle()">Save</button>
      </div>
    </div>
  </div>

  <!-- Admin undo -->
  <div class="modal" id="undoModal">
    <div class="modal-content">
      <div class="modal-head"><h3 id="undoTitle">Undo</h3><button class="modal-close" onclick="closeModals()">×</button></div>
      <div class="modal-body" id="undoBody"></div>
      <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModals()">Close</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js?v=11"></script>
  <script src="js/operator-update.js?v=3"></script>
</body>
</html>
